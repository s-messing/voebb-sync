[project]
name = "voebb"
version = "0.1.0"
description = "Programmatic read-only access to a VOEBB (Berlin public libraries) account"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "caldav>=3.2",
    "icalendar>=7.3",
    # Pulled in by caldav, but imported directly for its retry adapter and
    # exception types, so it is declared rather than relied on transitively.
    "niquests>=3.14",
]

[project.urls]
Repository = "https://github.com/s-messing/voebb-sync"

[project.scripts]
voebb = "voebb.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voebb"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return style
    "PTH",  # prefer pathlib
]

[tool.ruff.lint.per-file-ignores]
# Tests lean on assert-heavy, repetitive style on purpose.
"tests/*" = ["E501"]
